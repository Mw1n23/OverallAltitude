name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install package with the plot extra
        run: python -m pip install ".[plot]"
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: CLI smoke test
        run: overall-altitude --help
